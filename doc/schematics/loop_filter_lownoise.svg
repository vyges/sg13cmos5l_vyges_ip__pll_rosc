<text x="-1003.0" y="-245.5" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7b341e">vss</text>
<text x="-1010.0" y="-809.0" font-family="Helvetica,Arial,sans-serif" font-size="17.0" font-weight="bold" fill="#1a202c">loop_filter_lownoise -- dual-path loop filter (small-cap, low-noise)</text>
<text x="-1010.0" y="-774.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">Dual-path alternative to the baseline RC filter. The series resistor is replaced by a</text>
<text x="-1010.0" y="-758.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">proportional voltage source (pd_prop, buffered) in series with a small capacitor Cser.</text>
<text x="-1010.0" y="-742.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">The capacitive divider reproduces the resistive step, while noise injected by the</text>
<text x="-1010.0" y="-726.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">voltage source is attenuated by the capacitor ratio instead of reaching vctrl -- so the</text>
<text x="-1010.0" y="-710.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">whole filter scales down provided the charge-pump current scales with it.</text>
<text x="-1010.0" y="-680.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">Cint is a MOS capacitor held in INVERSION: far denser than MOM, and the only capacitor</text>
<text x="-1010.0" y="-664.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">form this PDK models (no accumulation varactor, no native device). L = 2.25u is 5x hv</text>
<text x="-1010.0" y="-648.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">L_min -- long enough that source/drain contacts do not waste area, short enough to keep</text>
<text x="-1010.0" y="-632.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">channel resistance down.</text>
<text x="-1010.0" y="-616.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">CONSTRAINT THAT LEAVES THIS CELL: vctrl must stay ABOVE the hv threshold (~0.7 V) or the</text>
<text x="-1010.0" y="-600.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">channel is not formed and Cint collapses. Swapping this filter in requires re-centring</text>
<text x="-1010.0" y="-584.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">the VCO band; it is not a drop-in replacement for the RC baseline.</text>
<text x="-1010.0" y="-554.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">OPEN: the capacitor ratio, and generation of pd_prop from the phase-detector outputs.</text>
<text x="-1010.0" y="-538.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">Ratio error moves loop SHAPE (peaking, lock time, jitter transfer) rather than noise, so</text>
<text x="-1010.0" y="-522.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">it is settled by a Monte-Carlo of the closed-loop response over mismatch -- budgeting</text>
<text x="-1010.0" y="-506.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">phase margin rather than chasing MOM matching. Vary the MOS and MOM capacitors</text>
<text x="-1010.0" y="-490.0" font-family="Helvetica,Arial,sans-serif" font-size="12.0" font-weight="normal" fill="#5a4b81">INDEPENDENTLY there: a mixed-type divider mismatches systematically, not as a pair.</text>
</svg>